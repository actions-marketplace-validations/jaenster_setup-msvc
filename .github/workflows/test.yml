name: test

# The point of this workflow is to answer one question honestly: can a GitHub
# runner compile AND LINK a real 32-bit Windows executable with a 2005-era
# Microsoft compiler? Everything else in this repository is bookkeeping around
# that answer.
#
# windows-latest is the job that matters: cl.exe and link.exe are 32-bit Windows
# binaries and run natively under WOW64, so none of wibo's gaps apply.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    name: catalogue is well-formed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every entry parses, resolves, and pins a hash per mirror
        run: python3 tests/test_catalogue.py
      - name: The catalogue listing renders
        run: python3 scripts/setup_msvc.py --list

  windows-link:
    name: compile and link on windows (${{ matrix.version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['14.00.50727.762', '14.00.50727.42']
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        id: msvc
        uses: ./
        with:
          version: ${{ matrix.version }}
          runner: native

      - name: The compiler is the exact build we asked for
        shell: bash
        run: |
          echo "requested: ${{ matrix.version }}"
          echo "got:       ${{ steps.msvc.outputs.version }}"
          [ "${{ steps.msvc.outputs.version }}" = "${{ matrix.version }}" ] \
            || { echo "::error::wrong compiler build"; exit 1; }
          echo "can-link:  ${{ steps.msvc.outputs.can-link }}"

      # pwsh, not bash. Git Bash's MSYS layer rewrites arguments that look like
      # paths, and `//Fo<path>` survives as a literal `//Fo...` that cl.exe
      # rejects with D9002 while still compiling to the wrong directory. pwsh
      # passes MSVC switches through untouched.
      - name: Compile an object
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          @'
          #include <windows.h>
          #include <stdio.h>
          #include <vector>
          #include <string>
          int main(void) {
              std::vector<std::string> v;
              v.push_back("redivivus");
              printf("%s %lu\n", v[0].c_str(), (unsigned long)GetTickCount());
              return 0;
          }
          '@ | Set-Content -Path out\t.cpp -Encoding ascii
          & cl.exe /c /nologo /O2 /Oy- /Ob1 /EHsc /GS /MT /W1 /Z7 `
              /D WIN32 /D NDEBUG /D _CONSOLE /Foout\t.obj out\t.cpp
          if ($LASTEXITCODE -ne 0) { throw "cl.exe exited $LASTEXITCODE" }
          if (-not (Test-Path out\t.obj)) { throw "no object produced" }
          Get-Item out\t.obj | Select-Object Name, Length

      - name: Link a real 32-bit PE
        if: steps.msvc.outputs.can-link == 'true'
        shell: pwsh
        run: |
          & link.exe /nologo /SUBSYSTEM:CONSOLE /OUT:out\t.exe out\t.obj
          if ($LASTEXITCODE -ne 0) { throw "link.exe exited $LASTEXITCODE" }
          if (-not (Test-Path out\t.exe)) { throw "no executable produced" }
          Get-Item out\t.exe | Select-Object Name, Length

      - name: It is a 32-bit PE, and it runs
        if: steps.msvc.outputs.can-link == 'true'
        shell: pwsh
        run: |
          $exe = "out/t.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          Write-Host ("machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0x014C) { throw "not i386 (expected 0x014C)" }
          & ".\out\t.exe"
          if ($LASTEXITCODE -ne 0) { throw "the executable did not run cleanly" }

      - name: Report what this toolchain cannot do
        if: steps.msvc.outputs.can-link != 'true'
        shell: bash
        run: |
          echo "::warning::This toolchain is compile-only: no libraries, so no link."

  linux-compile-only:
    name: compile on linux via wibo (no link, expected)
    runs-on: ubuntu-24.04
    continue-on-error: true   # wibo is secondary; it must not gate the repo
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        id: msvc
        uses: ./
        with:
          version: '14.00.50727.762'
          runner: wibo
      - name: Compile an object with no wine anywhere
        shell: bash
        run: |
          mkdir -p out
          printf 'int triple(int x){return x*3;}\n' > out/t.cpp
          "$WIBO" "$MSVC_BIN/cl.exe" /c /nologo /O2 /Z7 \
            "/Fo$("$WIBO" path -w "$PWD/out/t.obj")" \
            "$("$WIBO" path -w "$PWD/out/t.cpp")"
          file out/t.obj
          test -f out/t.obj
